<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoLie</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="popup-header">
      <img src="../assets/logo.svg" alt="NoLie" class="popup-logo">
      <h1>NoLie</h1>
    </div>
    <div class="popup-body">
      <p class="popup-description">AI-powered fact verification</p>
      <button id="scanBtn" class="btn btn-primary">
        <span class="btn-icon">🔍</span>
        Scan This Page
      </button>
      <button id="liveCaptionsBtn" class="btn btn-primary" style="background:#2d4a2d;border-color:#3d6b3d;color:#7ddc7d">
        <span class="btn-icon">📝</span>
        Live (Captions)
      </button>
      <button id="liveAudioBtn" class="btn btn-primary" style="background:#2d2d4a;border-color:#3d3d6b;color:#7d7ddc">
        <span class="btn-icon">🎙</span>
        Live (Audio)
      </button>
      <button id="openPanelBtn" class="btn btn-secondary">
        Open Side Panel
      </button>
    </div>
    <div class="popup-footer">
      <a href="#" id="optionsLink">Settings</a>
      <a href="#" id="historyLink">History</a>
    </div>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
